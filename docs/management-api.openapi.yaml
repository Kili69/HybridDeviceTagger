openapi: 3.0.3
info:
  title: HybridDeviceTagger Management API
  version: 1.3.0
  description: REST API for authentication discovery, forest-domain and tagging configuration, operational actions, run status, trace retrieval, and the Owner/Contributor-only configuration portal (activity log, service account, LDAP validation, trust anchors).
servers:
  - url: https://func-hybriddevicetagger.azurewebsites.net/api/management
security:
  - entraId: []
paths:
  /authentication:
    get:
      operationId: getManagementApiAuthentication
      summary: Get authentication metadata for this deployment
      description: Returns the public delegated token scope. This is the only operation that does not require an Entra token.
      security: []
      responses:
        '200':
          description: Authentication metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationMetadata'
  /active-directory:
    get:
      operationId: getActiveDirectoryConfiguration
      summary: Read the effective Active Directory forest DNS domain
      description: Requires Reader, RuleAdministrator, PasswordRotationAdministrator, or effective Function App Owner/Contributor access. Does not contact AD.
      responses:
        '200':
          description: Effective domain and version
          headers:
            ETag:
              description: Stored configuration version, omitted before the first change
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveDirectoryConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: setActiveDirectoryConfiguration
      summary: Correct the Active Directory forest DNS domain
      description: Requires effective Function App Owner/Contributor access; application roles are not accepted because the domain selects the servers that receive the service-account password. Validates DNS syntax only, so broken AD connectivity does not prevent repairs. New forest connections read the persisted override without a restart.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  maxLength: 253
                  example: contoso.com
      responses:
        '200':
          description: Stored domain and version
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveDirectoryConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Request body exceeds 65,536 bytes
  /tagging-rules:
    get:
      operationId: getTaggingConfiguration
      summary: Get the effective tagging rules
      description: Requires HybridDeviceTagger.Reader or HybridDeviceTagger.RuleAdministrator.
      responses:
        '200':
          description: Current rules and configuration version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggingConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: replaceTaggingConfiguration
      summary: Replace all tagging rules
      description: Requires HybridDeviceTagger.RuleAdministrator.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/TaggingRule'
      responses:
        '200':
          description: Replaced configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggingConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Request body exceeds 65,536 bytes
  /tagging-rules/{ruleName}:
    parameters:
      - name: ruleName
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    put:
      operationId: upsertTaggingRule
      summary: Add or replace one named rule
      description: Requires HybridDeviceTagger.RuleAdministrator.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaggingRule'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggingConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeTaggingRule
      summary: Remove one named rule
      description: Requires HybridDeviceTagger.RuleAdministrator.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggingConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /status/device-tagging:
    get:
      operationId: getDeviceTaggingStatus
      summary: Get the latest device-tagging run status
      description: Requires HybridDeviceTagger.Reader or HybridDeviceTagger.TaggingOperator.
      responses:
        '200':
          description: Latest status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /status/password-rotation:
    get:
      operationId: getPasswordRotationStatus
      summary: Get the latest password check and last actual password change
      description: Requires HybridDeviceTagger.Reader or HybridDeviceTagger.PasswordRotationAdministrator.
      responses:
        '200':
          description: Latest status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /actions/device-tagging:
    post:
      operationId: runDeviceTagging
      summary: Queue an immediate device-tagging run
      description: Requires HybridDeviceTagger.TaggingOperator. The run executes asynchronously; poll the Location URI until its invocationId reaches Succeeded or Failed.
      responses:
        '202':
          description: Run request accepted
          headers:
            Location:
              description: Relative URI of the device-tagging status endpoint.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OperationConflict'
  /actions/password-rotation:
    post:
      operationId: runPasswordRotation
      summary: Queue a forced Active Directory service-account password rotation
      description: Requires HybridDeviceTagger.PasswordRotationAdministrator. The rotation executes asynchronously; poll the Location URI until its invocationId reaches Succeeded or Failed.
      responses:
        '202':
          description: Rotation request accepted
          headers:
            Location:
              description: Relative URI of the password-rotation status endpoint.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedOperation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OperationConflict'
  /actions/initialize-ad-credential:
    post:
      operationId: initializeActiveDirectoryCredential
      summary: Validate and initialize the Active Directory service-account credential
      description: Requires HybridDeviceTagger.PasswordRotationAdministrator. The current Key Vault secret must be missing or the unusable placeholder created by the installer; an existing password is never replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 256
                  writeOnly: true
      responses:
        '200':
          description: Credential validated against Active Directory and initialized through the Function managed identity
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Request body exceeds 65,536 bytes
  /traces/device-tagging/latest:
    get:
      operationId: downloadLatestDeviceTaggingTrace
      summary: Download the latest JSONL trace
      description: Requires HybridDeviceTagger.Reader or HybridDeviceTagger.TaggingOperator.
      responses:
        '200':
          description: Latest device-tagging trace
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /portal/session:
    get:
      operationId: getPortalSession
      summary: Confirm configuration-portal access
      description: Requires effective Owner or Contributor on the Function App; application roles are not accepted. Records a portal sign-in activity.
      responses:
        '200':
          description: Signed-in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                  activityLogAvailable:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
  /portal/activity:
    get:
      operationId: getPortalActivity
      summary: Read the activity log, newest first
      description: Requires effective Owner or Contributor on the Function App. Reads from Log Analytics; new records appear after the ingestion delay.
      parameters:
        - name: hours
          in: query
          schema: { type: integer, minimum: 1, maximum: 720, default: 24 }
        - name: category
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [Configuration, Tagging, Password, Access] }
        - name: outcome
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [Succeeded, Failed, Denied] }
        - name: take
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Matching activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  hours: { type: integer }
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '503':
          description: No Application Insights resource is configured for activity queries
  /portal/active-directory:
    get:
      operationId: getPortalActiveDirectory
      summary: Read the effective forest domain and service account
      description: Requires effective Owner or Contributor on the Function App.
      responses:
        '200':
          description: Effective configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  username: { type: string }
                  distinguishedName: { type: string, description: Empty when resolved from the UPN }
                  accountSource: { type: string, enum: [appSetting, blob] }
                  source: { type: string, enum: [appSetting, blob] }
                  eTag: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
  /portal/active-directory/validate:
    post:
      operationId: validatePortalActiveDirectoryAccess
      summary: Validate LDAP access with the stored credential
      description: Requires effective Owner or Contributor on the Function App. Reports every domain-controller attempt, including certificate validation failures. Never returns the password.
      responses:
        '200':
          description: Validation result; inspect succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LdapAccessValidation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '409':
          description: No credential has been stored yet
  /portal/active-directory/account:
    put:
      operationId: changePortalActiveDirectoryAccount
      summary: Change the service account or replace its password
      description: Requires effective Owner or Contributor on the Function App. Validates a TLS-protected bind with the supplied credential before storing it, holds the password-rotation lock, and invalidates the staged rotation password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 256, example: svc-tagger@contoso.com }
                password: { type: string, format: password, maxLength: 256 }
                distinguishedName: { type: string, maxLength: 1024, description: Optional; empty resolves it from the UPN }
      responses:
        '200':
          description: Stored service account
        '400':
          description: Invalid input or the credential cannot bind; attempts contain per-server diagnostics
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '409':
          description: A password rotation is running or the configuration changed concurrently
        '413':
          description: Request body exceeds 65,536 bytes
  /portal/certificates:
    get:
      operationId: getPortalCertificates
      summary: List the LDAP trust anchors
      description: Requires effective Owner or Contributor on the Function App.
      responses:
        '200':
          description: Trust anchors and version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedCertificates'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
    post:
      operationId: addPortalCertificate
      summary: Add an LDAP trust anchor
      description: Requires effective Owner or Contributor on the Function App. Accepts one public PEM or Base64 DER certificate; private keys, expired certificates, and duplicates are rejected.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateUpload'
      responses:
        '200':
          description: Updated trust anchors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedCertificates'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '409':
          $ref: '#/components/responses/Conflict'
  /portal/certificates/{thumbprint}:
    parameters:
      - name: thumbprint
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: replacePortalCertificate
      summary: Replace an LDAP trust anchor
      description: Requires effective Owner or Contributor on the Function App.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateUpload'
      responses:
        '200':
          description: Updated trust anchors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedCertificates'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removePortalCertificate
      summary: Remove an LDAP trust anchor
      description: Requires effective Owner or Contributor on the Function App. The last trust anchor cannot be removed (HTTP 400).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Updated trust anchors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedCertificates'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /portal/directory/{kind}:
    get:
      operationId: searchPortalDirectory
      summary: Search Entra security groups or administrative units by display-name prefix
      description: Requires effective Owner or Contributor on the Function App. Returns up to 25 objects; dynamic, mail-enabled, or synchronized groups and dynamic administrative units are marked not assignable.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [groups, administrative-units] }
        - name: search
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Matching objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
  /portal/directory/resolve:
    post:
      operationId: resolvePortalDirectory
      summary: Resolve group and administrative-unit IDs to display names
      description: Requires effective Owner or Contributor on the Function App. At most 200 IDs; deleted objects are omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupIds: { type: array, items: { type: string, format: uuid } }
                administrativeUnitIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Existing objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdministratorRequired'
components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag returned by the latest configuration read; stale values return HTTP 409.
      schema:
        type: string
  securitySchemes:
    entraId:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenantId}/v2.0/.well-known/openid-configuration
  responses:
    BadRequest:
      description: Invalid request or configuration
    Unauthorized:
      description: A valid Microsoft Entra token for this API is required
    Forbidden:
      description: The authenticated principal lacks the application role required by this operation
    NotFound:
      description: The requested rule or operational artifact does not exist
    Conflict:
      description: Another request changed the configuration concurrently
    OperationConflict:
      description: The requested operation is already running
    AdministratorRequired:
      description: The configuration portal requires effective Owner or Contributor on the Function App
  schemas:
    DirectoryObject:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        description: { type: string, nullable: true }
        assignable: { type: boolean }
        note: { type: string, nullable: true }
    ActivityRecord:
      type: object
      properties:
        timestampUtc: { type: string, format: date-time }
        category: { type: string, enum: [Configuration, Tagging, Password, Access] }
        action: { type: string }
        outcome: { type: string, enum: [Succeeded, Failed, Denied] }
        actor: { type: string }
        target: { type: string }
        details: { type: string }
    LdapAccessValidation:
      type: object
      properties:
        succeeded: { type: boolean }
        invalidCredentials: { type: boolean }
        error: { type: string, nullable: true }
        attempts:
          type: array
          items:
            type: object
            properties:
              server: { type: string }
              port: { type: integer }
              transport: { type: string, enum: [Ldaps, StartTls] }
              succeeded: { type: boolean }
              resultCode: { type: integer, nullable: true, description: LDAP result code; -2 for a rejected server certificate }
              error: { type: string, nullable: true }
    CertificateUpload:
      type: object
      required: [certificate]
      properties:
        certificate:
          type: string
          description: One public certificate as PEM or Base64-encoded DER
    TrustedCertificates:
      type: object
      properties:
        certificates:
          type: array
          items:
            type: object
            properties:
              thumbprint: { type: string }
              subject: { type: string }
              issuer: { type: string }
              notBeforeUtc: { type: string, format: date-time }
              notAfterUtc: { type: string, format: date-time }
              isCertificateAuthority: { type: boolean }
              addedBy: { type: string }
              addedUtc: { type: string, format: date-time, nullable: true }
        eTag: { type: string, nullable: true }
        lastModifiedUtc: { type: string, format: date-time, nullable: true }
        source: { type: string, enum: [blob, package, operatingSystem] }
    ActiveDirectoryConfiguration:
      type: object
      required: [domain, source]
      properties:
        domain:
          type: string
          description: Effective forest DNS name
        eTag:
          type: string
          nullable: true
        lastModifiedUtc:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum: [appSetting, blob]
    AuthenticationMetadata:
      type: object
      required:
        - tokenScope
      properties:
        tokenScope:
          type: string
          pattern: '^api://[0-9a-fA-F-]{36}/\.default$'
          example: api://11111111-1111-1111-1111-111111111111/.default
    TaggingRule:
      type: object
      required:
        - name
        - description
        - baseDn
        - extensionAttributes
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        baseDn:
          type: string
          maxLength: 2048
          description: >-
            Forest-relative OU path or complete DN whose derived DNS domain exactly matches a
            dnsRoot advertised by the configured Active Directory forest. Foreign domains are
            rejected before persistence and checked again before LDAP access.
        extensionAttributes:
          type: object
          additionalProperties:
            type: string
            maxLength: 1024
        entraGroupIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        administrativeUnitIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    TaggingConfiguration:
      type: object
      required:
        - rules
        - source
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/TaggingRule'
        eTag:
          type: string
          nullable: true
        lastModifiedUtc:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum:
            - appSetting
            - blob
    OperationStatus:
      type: object
      required:
        - operation
        - invocationId
        - state
        - startedAtUtc
      properties:
        operation:
          type: string
        invocationId:
          type: string
        state:
          type: string
          enum:
            - Queued
            - Running
            - Succeeded
            - Failed
        startedAtUtc:
          type: string
          format: date-time
        completedAtUtc:
          type: string
          format: date-time
          nullable: true
        lastPasswordChangeAtUtc:
          type: string
          format: date-time
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        errorType:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
    AcceptedOperation:
      type: object
      required:
        - invocationId
        - state
        - statusUri
      properties:
        invocationId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - Queued
        statusUri:
          type: string
          example: /api/management/status/device-tagging
