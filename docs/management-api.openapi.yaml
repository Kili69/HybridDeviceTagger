openapi: 3.0.3
info:
  title: HybridDeviceTagger Management API
  version: 0.1.20261005.2
  description: REST API for authentication discovery, tagging configuration, operational actions, run status, and trace retrieval.
servers:
  - url: https://func-hybriddevicetagger.azurewebsites.net/api/management
security:
  - entraId: []
paths:
  /authentication:
    get:
      operationId: getManagementApiAuthentication
      summary: Get authentication metadata for this deployment
      description: Returns the public delegated token scope. This is the only operation that does not require an Entra token.
      security: []
      responses:
        '200':
          description: Authentication metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationMetadata'
  /tagging-rules:
    get:
      operationId: getTaggingConfiguration
      summary: Get the effective tagging rules
      description: Requires HybridDeviceTagger.Reader or HybridDeviceTagger.RuleAdministrator.
      responses:
        '200':
          description: Current rules and configuration version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggingConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: replaceTaggingConfiguration
      summary: Replace all tagging rules
      description: Requires HybridDeviceTagger.RuleAdministrator.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/TaggingRule'
      responses:
        '200':
          description: Replaced configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggingConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Request body exceeds 65,536 bytes
  /tagging-rules/{ruleName}:
    parameters:
      - name: ruleName
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    put:
      operationId: upsertTaggingRule
      summary: Add or replace one named rule
      description: Requires HybridDeviceTagger.RuleAdministrator.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaggingRule'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggingConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeTaggingRule
      summary: Remove one named rule
      description: Requires HybridDeviceTagger.RuleAdministrator.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggingConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /status/device-tagging:
    get:
      operationId: getDeviceTaggingStatus
      summary: Get the latest device-tagging run status
      description: Requires HybridDeviceTagger.Reader or HybridDeviceTagger.TaggingOperator.
      responses:
        '200':
          description: Latest status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /status/password-rotation:
    get:
      operationId: getPasswordRotationStatus
      summary: Get the latest password check and last actual password change
      description: Requires HybridDeviceTagger.Reader or HybridDeviceTagger.PasswordRotationAdministrator.
      responses:
        '200':
          description: Latest status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /actions/device-tagging:
    post:
      operationId: runDeviceTagging
      summary: Run device tagging immediately
      description: Requires HybridDeviceTagger.TaggingOperator.
      responses:
        '200':
          description: Completed tagging result and invocation ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTaggingActionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OperationConflict'
  /actions/password-rotation:
    post:
      operationId: runPasswordRotation
      summary: Force an immediate Active Directory service-account password rotation
      description: Requires HybridDeviceTagger.PasswordRotationAdministrator.
      responses:
        '200':
          description: Completed password-rotation result and invocation ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRotationActionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OperationConflict'
  /actions/initialize-ad-credential:
    post:
      operationId: initializeActiveDirectoryCredential
      summary: Validate and initialize the Active Directory service-account credential
      description: Requires HybridDeviceTagger.PasswordRotationAdministrator. The current Key Vault secret must not already exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 256
                  writeOnly: true
      responses:
        '200':
          description: Credential validated against Active Directory and initialized through the Function managed identity
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Request body exceeds 65,536 bytes
  /traces/device-tagging/latest:
    get:
      operationId: downloadLatestDeviceTaggingTrace
      summary: Download the latest JSONL trace
      description: Requires HybridDeviceTagger.Reader or HybridDeviceTagger.TaggingOperator.
      responses:
        '200':
          description: Latest device-tagging trace
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /trusted-certificates:
    get:
      operationId: getTrustedCertificates
      summary: Get Active Directory LDAPS trust certificates
      description: Requires HybridDeviceTagger.Reader or HybridDeviceTagger.CertificateAdministrator. Returns metadata only.
      responses:
        '200':
          description: Effective trusted-certificate metadata and collection version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedCertificateCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: addTrustedCertificate
      summary: Add an Active Directory LDAPS trust certificate
      description: Requires HybridDeviceTagger.CertificateAdministrator. Existing certificates are preserved.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - certificate
              properties:
                certificate:
                  type: string
                  format: byte
                  description: Base64-encoded DER or PEM public X.509 certificate.
      responses:
        '200':
          description: Updated trusted-certificate collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedCertificateCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Request body exceeds 65,536 bytes
  /trusted-certificates/{thumbprint}:
    parameters:
      - name: thumbprint
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9A-Fa-f]{40}$'
    delete:
      operationId: removeTrustedCertificate
      summary: Remove an Active Directory LDAPS trust certificate
      description: Requires HybridDeviceTagger.CertificateAdministrator. The final certificate cannot be removed.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Remaining trusted-certificate collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedCertificateCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag returned by the latest configuration read; stale values return HTTP 409.
      schema:
        type: string
  securitySchemes:
    entraId:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenantId}/v2.0/.well-known/openid-configuration
  responses:
    BadRequest:
      description: Invalid request or tagging configuration
    Unauthorized:
      description: A valid Microsoft Entra token for this API is required
    Forbidden:
      description: The authenticated principal lacks the application role required by this operation
    NotFound:
      description: The requested rule or operational artifact does not exist
    Conflict:
      description: Another request changed the configuration concurrently
    OperationConflict:
      description: The requested operation is already running
  schemas:
    AuthenticationMetadata:
      type: object
      required:
        - tokenScope
      properties:
        tokenScope:
          type: string
          pattern: '^api://[0-9a-fA-F-]{36}/\.default$'
          example: api://11111111-1111-1111-1111-111111111111/.default
    TaggingRule:
      type: object
      required:
        - name
        - description
        - baseDn
        - extensionAttributes
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        baseDn:
          type: string
          maxLength: 2048
        extensionAttributes:
          type: object
          additionalProperties:
            type: string
            maxLength: 1024
        entraGroupIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        administrativeUnitIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    TaggingConfiguration:
      type: object
      required:
        - rules
        - source
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/TaggingRule'
        eTag:
          type: string
          nullable: true
        lastModifiedUtc:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum:
            - appSetting
            - blob
    TrustedCertificate:
      type: object
      required:
        - thumbprint
        - subject
        - issuer
        - notBeforeUtc
        - notAfterUtc
      properties:
        thumbprint:
          type: string
          pattern: '^[0-9A-F]{40}$'
        subject:
          type: string
        issuer:
          type: string
        notBeforeUtc:
          type: string
          format: date-time
        notAfterUtc:
          type: string
          format: date-time
    TrustedCertificateCollection:
      type: object
      required:
        - certificates
        - source
      properties:
        certificates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TrustedCertificate'
        eTag:
          type: string
          nullable: true
        lastModifiedUtc:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum:
            - package
            - blob
    OperationStatus:
      type: object
      required:
        - operation
        - invocationId
        - state
        - startedAtUtc
      properties:
        operation:
          type: string
        invocationId:
          type: string
        state:
          type: string
          enum:
            - Running
            - Succeeded
            - Failed
        startedAtUtc:
          type: string
          format: date-time
        completedAtUtc:
          type: string
          format: date-time
          nullable: true
        lastPasswordChangeAtUtc:
          type: string
          format: date-time
          nullable: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        errorType:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
    DeviceTaggingActionResult:
      type: object
      required:
        - invocationId
        - result
      properties:
        invocationId:
          type: string
          format: uuid
        result:
          type: object
          required:
            - discovered
            - updated
            - unchanged
            - notFound
            - notHybridJoined
            - membershipsAdded
            - membershipsRemoved
            - removedFromScope
          additionalProperties:
            type: integer
    PasswordRotationActionResult:
      type: object
      required:
        - invocationId
        - result
      properties:
        invocationId:
          type: string
          format: uuid
        result:
          type: object
          required:
            - outcome
          properties:
            outcome:
              type: string
              enum:
                - Rotated
                - RecoveredFromNext
                - DeferredNoSecureConnection
            currentPasswordAgeDays:
              type: integer
              nullable: true