name: Publish PowerShell module

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published main release tag to publish to PowerShell Gallery
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: windows-latest
    environment: psgallery

    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the release package and verify module metadata
        id: module
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseJson = gh api "repos/${{ github.repository }}/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The release must exist before Gallery publication.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw 'Only published stable releases may be sent to PowerShell Gallery.' }
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to fetch origin/main.'
          }

          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "Release commit '$env:GITHUB_SHA' is not contained in the main branch."
          }

          $version = ./scripts/Get-ProductVersion.ps1 -Detailed
          if (-not $version.IsTaggedRelease -or $env:RELEASE_TAG -ne $version.ReleaseTag) {
              throw "Release tag '$env:RELEASE_TAG' must be the release tag '$($version.ReleaseTag)' of the checked-out commit."
          }

          # The package build stamps the product version into the module manifest.
          ./scripts/Build-InstallationPackage.ps1
          $modulePath = Join-Path $PWD "artifacts/HybridDeviceTagger-$($version.ProductVersion)/HybridDeviceTagger.Management"
          $manifestPath = Join-Path $modulePath 'HybridDeviceTagger.Management.psd1'
          $manifest = Test-ModuleManifest -Path $manifestPath
          $moduleVersion = $manifest.Version.ToString()
          if ($moduleVersion -ne $version.CoreVersion) {
              throw "Module version '$moduleVersion' does not match product version '$($version.CoreVersion)'."
          }

          Import-Module $manifestPath -Force
          $exportedFunctions = @(Get-Command -Module HybridDeviceTagger.Management -CommandType Function)
          if ($exportedFunctions.Count -ne $manifest.ExportedFunctions.Count) {
              throw "Imported $($exportedFunctions.Count) functions, but the manifest exports $($manifest.ExportedFunctions.Count)."
          }

          "path=$modulePath" >> $env:GITHUB_OUTPUT
          "version=$moduleVersion" >> $env:GITHUB_OUTPUT
      - name: Check PowerShell Gallery version
        id: gallery
        shell: pwsh
        env:
          MODULE_VERSION: ${{ steps.module.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $existingModule = Find-Module `
              -Name 'HybridDeviceTagger.Management' `
              -Repository 'PSGallery' `
              -RequiredVersion $env:MODULE_VERSION `
              -ErrorAction SilentlyContinue

          $alreadyPublished = $null -ne $existingModule
          "already-published=$($alreadyPublished.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($alreadyPublished) {
              Write-Host "HybridDeviceTagger.Management $env:MODULE_VERSION is already available on PSGallery."
          }

      - name: Publish module to PowerShell Gallery
        if: ${{ steps.gallery.outputs.already-published != 'true' }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.HYBRIDDEVICETAGGER_PSMODUL }}
          MODULE_PATH: ${{ steps.module.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
              throw 'Repository secret HYBRIDDEVICETAGGER_PSMODUL is not configured.'
          }

          Publish-Module `
              -Path $env:MODULE_PATH `
              -Repository 'PSGallery' `
              -NuGetApiKey $env:NUGET_API_KEY `
              -Force `
              -ErrorAction Stop
