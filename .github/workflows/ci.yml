name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore HybridDeviceTagger.sln
      - run: dotnet build HybridDeviceTagger.sln --configuration Release --no-restore
      - run: dotnet test HybridDeviceTagger.sln --configuration Release --no-build