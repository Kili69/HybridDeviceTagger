name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The product version is derived from the release tags, so the full history is required.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/Build-InstallationPackage.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installation-package
          path: artifacts/*.zip
